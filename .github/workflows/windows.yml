name: Windows build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt pytest pyinstaller
      - name: Stamp the build number (used by the in-app updater)
        shell: bash
        run: printf 'BUILD = %s\nCOMMIT = "%s"\n' "$GITHUB_RUN_NUMBER" "${GITHUB_SHA::7}" > motion_studio/_build.py
      - name: Tests (includes a real ProRes 4444 export)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
      - name: Build the app
        shell: bash
        run: |
          pyinstaller --noconfirm --windowed --name MotionStudio --collect-submodules motion_studio run.py
          python -c "import imageio_ffmpeg,shutil; shutil.copy(imageio_ffmpeg.get_ffmpeg_exe(), 'dist/MotionStudio/ffmpeg.exe')"
      - name: Smoke test the packaged FFmpeg
        shell: bash
        run: dist/MotionStudio/ffmpeg.exe -hide_banner -encoders | grep -q prores_ks
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/MotionStudio -DestinationPath MotionStudio-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MotionStudio-win64
          path: MotionStudio-win64.zip
      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          git log -1 --pretty=%B > notes.txt
          printf '\nFirst install: unzip anywhere and run MotionStudio.exe. Later versions install from Help > Check for updates.\n' >> notes.txt
          gh release create "$tag" MotionStudio-win64.zip --prerelease --target "$GITHUB_SHA" \
            --title "Motion Studio (build ${GITHUB_RUN_NUMBER})" --notes-file notes.txt
